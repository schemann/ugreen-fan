# ugreen-fan configuration — preset for UGREEN DXP4800.
# Copied to config.toml by `ugreen-fan install`; adjust it there. Temperatures in °C, PWM in 0..255.

supported_models = ["DXP4800"]          # /sys/class/dmi/id/product_name
module_params = "ignore_resource_conflict=1"
chip = "it8613"                         # hwmon name of the fan controller
pwm = 3                                 # pwmN that drives the fan
fan = 3                                 # fanN_input with its tachometer
interval = 10                           # seconds between control steps (max 10)
hysteresis = 2                          # fall only after cooling by this much
min_pwm = 51                            # never go below: the fan must keep spinning
truenas_alert = true                    # bell alert on problems (see README)

[sources.disks]
driver = "drivetemp"                    # every SATA drive in the bays; USB disks and NVMe are skipped
valid = [1, 80]                         # a reading outside this range → failsafe
curve = [[42, 60], [46, 100], [48, 128], [50, 170], [55, 255]]

[sources.cpu]
driver = "it8613"                       # temp1 of the chip is the CPU (PECI)
channel = 1
valid = [1, 110]
curve = [[60, 51], [75, 128], [90, 255]]
